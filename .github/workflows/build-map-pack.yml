name: Офлайн-карта водителя (OSM → PMTiles)

# Пересборка пакета карты Тюмени и Тюменского района из свежих данных
# OpenStreetMap. Готовый пакет — в артефактах запуска: скачать и положить
# в TaxiDriver/Resources/Raw/map/ перед сборкой APK.
on:
  schedule:
    - cron: "0 2 * * 1"      # каждый понедельник, 02:00 UTC
  workflow_dispatch:
    inputs:
      bounds:
        description: "bbox: запад,юг,восток,север"
        default: "64.95,56.70,66.35,57.75"
      maxzoom:
        description: "Максимальный зум пакета"
        default: "14"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Сборка пакета
        env:
          BOUNDS: ${{ github.event.inputs.bounds || '64.95,56.70,66.35,57.75' }}
          MAXZOOM: ${{ github.event.inputs.maxzoom || '14' }}
          JAVA_HEAP: 6g
        run: |
          chmod +x TaxiDriver/maps/build-pmtiles.sh
          ./TaxiDriver/maps/build-pmtiles.sh

      - name: Размер результата
        run: ls -lh TaxiDriver/Resources/Raw/map/ | grep -E 'pmtiles|font-'

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: tyumen-map-pack
          retention-days: 30
          path: |
            TaxiDriver/Resources/Raw/map/tyumen.pmtiles
            TaxiDriver/Resources/Raw/map/font-*.pbf
