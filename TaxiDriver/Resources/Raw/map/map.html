<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
html,body{margin:0;padding:0;height:100%;width:100%;background:#F1F0EC;overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.55}
#badge{position:absolute;left:8px;top:8px;z-index:5;display:none;
  background:rgba(220,38,38,.92);color:#fff;font:600 12px sans-serif;
  padding:5px 9px;border-radius:8px;pointer-events:none}
#dl.busy{color:#a1a1aa}
.mk{width:18px;height:18px;border-radius:50%;border:3px solid #111;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.mk.a{background:#FF9800}.mk.b{background:#4CAF50}.mk.s{background:#38BDF8}
/* Машина водителя: значок авто, разворачивается по курсу движения */
#car{width:44px;height:44px;will-change:transform;pointer-events:none}
#car svg{display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
#car .body{transition:transform .35s linear}

/* Навигационная карточка — крупная и читаемая на ходу, без копирования
   дизайна Яндекса: собственный интерфейс поверх MapLibre */
#navPanel{position:absolute;z-index:8;left:64px;right:58px;top:10px;display:none;
  min-height:64px;background:rgba(18,18,22,.94);color:#fff;border-radius:16px;
  box-shadow:0 5px 22px rgba(0,0,0,.38);padding:10px 13px;pointer-events:none;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;backdrop-filter:blur(8px)}
#navRow{display:flex;align-items:center;gap:11px}
#navIcon{width:40px;min-width:40px;text-align:center;color:#facc15;font-size:34px;
  line-height:38px;font-weight:900}
#navDistance{font-size:18px;line-height:21px;font-weight:900;color:#fff}
#navStreet{font-size:12px;line-height:16px;color:#d4d4d8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
#navSummary{font-size:10px;color:#a1a1aa;margin-top:3px}

/* Легенда живых пробок TomTom: показывается только при включённом слое */
#trafficLegend{position:absolute;z-index:7;left:9px;bottom:23px;display:none;
  background:rgba(255,255,255,.93);color:#27272a;border-radius:10px;
  padding:6px 8px;font:700 9px/12px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25);
  pointer-events:none}
#trafficLegend span{display:inline-flex;align-items:center;margin-right:7px;gap:3px}
#trafficLegend i{display:inline-block;width:13px;height:4px;border-radius:3px}
#trafficLegend span:last-child{margin-right:0}

/* В режиме ведения карта чуть контрастнее — дороги/повороты читаются быстрее */
body.nav-mode .maplibregl-canvas{filter:saturate(1.08) contrast(1.04)}
</style></head>
<body>
<div id="map"></div>
<div id="fatal" style="position:absolute;inset:0;display:none;z-index:9;
  color:#fca5a5;font:600 14px sans-serif;padding:26px;text-align:center">
  Не удалось загрузить карту MapLibre.<br>Перезапустите приложение.
</div>
<div id="badge">Офлайн · карта из памяти</div>
<div id="navPanel">
  <div id="navRow">
    <div id="navIcon">↑</div>
    <div style="min-width:0;flex:1">
      <div id="navDistance">Следуйте по маршруту</div>
      <div id="navStreet"></div>
      <div id="navSummary"></div>
    </div>
  </div>
</div>
<div id="trafficLegend">
  <span><i style="background:#2EAB30"></i>свободно</span>
  <span><i style="background:#F1BF40"></i>плотно</span>
  <span><i style="background:#F18237"></i>медленно</span>
  <span><i style="background:#E70704"></i>пробка</span>
</div>
<script src="maplibre-gl.js"></script>
<script>
/* Тайлы отдаёт локальный C#-сервер: сначала файл офлайн-кеша,
   затем сеть с сохранением. JavaScript-кеш больше не участвует. */

/* ---------- Карта ---------- */
var TILE = location.origin + '/tile/{z}/{x}/{y}.png';
var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    // Шрифты подписей векторной карты отдаёт локальный сервер приложения
    glyphs: location.origin + '/fonts/{fontstack}/{range}.pbf',
    sources: { osm: { type: 'raster', tiles: [TILE], tileSize: 256, maxzoom: 19,
      attribution: '© OpenStreetMap' } },
    layers: [
      // Светлый фон под тайлами: незагруженные участки выглядят как пустая
      // карта, а не как чёрные дыры на экране.
      { id: 'bg', type: 'background', paint: { 'background-color': '#F1F0EC' } },
      { id: 'osm', type: 'raster', source: 'osm',
        paint: {
          'raster-fade-duration': 0,
          'raster-contrast': 0.08,
          'raster-saturation': 0.06,
          'raster-brightness-min': 0.04,
          'raster-brightness-max': 0.98
        } }
    ]
  },
  center: [65.5272, 57.1522], zoom: 12,
  maxPitch: 50,
  attributionControl: { compact: true }
});
// Явно включаем сенсорные жесты (на случай, если WebView/скролл их глушат):
// свести/развести — масштаб, тащить — перемещение, двойной тап — зум.
// Наклон карты отключаем — водителю важнее стабильная плоскость.
try {
  map.touchZoomRotate.enable();
  map.dragPan.enable();
  map.doubleClickZoom.enable();
  map.touchPitch.disable();
  // Поворот карты двумя пальцами разрешён: в навигаторском режиме карта
  // разворачивается по курсу, водитель может вернуть север вверх сам
  map.touchZoomRotate.enableRotation();
} catch (e) { console.warn('touch config', e); }

/* -- Ручной режим камеры --------------------------------------------------
   Жест пользователя приостанавливает автокамеру (следование за машиной и
   автообзор маршрута): карту можно свободно приблизить к точке назначения
   и рассмотреть её. Каждый новый жест продлевает паузу. Камера вернётся
   к машине сама через HOLD_MS без жестов либо сразу по кнопке «где я». */
var HOLD_MS = 20000;
var cameraHoldUntil = 0;
function holdCamera(){ cameraHoldUntil = Date.now() + HOLD_MS; }
function cameraHeld(){ return Date.now() < cameraHoldUntil; }
function releaseCamera(){ cameraHoldUntil = 0; }
['dragstart', 'zoomstart', 'rotatestart', 'pitchstart'].forEach(function(ev){
  map.on(ev, function(e){ if (e && e.originalEvent) holdCamera(); });
});
// Кнопка «моё местоположение» — явное возвращение в режим следования
try { map.on('trackuserlocationstart', function(){ releaseCamera(); }); } catch (e) {}

// Позиция обязана быть top-left|top-right|bottom-left|bottom-right:
// значение 'right' роняло инициализацию карты (appendChild of undefined),
// из-за чего window.setRoute не создавался и карта оставалась пустой.
/* Каждый контрол — в своей защите: раньше одна ошибка в addControl
   останавливала ВЕСЬ скрипт, и карта висела без кнопок, позиции и маршрута. */
try {
  map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: true, visualizePitch: true }), 'top-right');
} catch (e) { console.warn('nav control', e); }

var geo = null;
try {
  geo = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000 },
    trackUserLocation: true,
    showUserLocation: true,
    showAccuracyCircle: false
  });
  map.addControl(geo, 'top-right');
  map.on('load', function(){
    setTimeout(function(){ try { geo.trigger(); } catch(e){} }, 600);
  });
} catch (e) { console.warn('geolocate', e); }

/* Резервная геолокация браузера: если контрол недоступен, позиция всё равно
   появится и карта отцентрируется на машине, а не на центре города. */
try {
  if (navigator.geolocation){
    navigator.geolocation.watchPosition(function(pos){
      window.updateDriver(pos.coords.latitude, pos.coords.longitude, false);
      if (!window._centered){
        window._centered = true;
        map.jumpTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14 });
      }
    }, function(){}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
  }
} catch (e) { console.warn('watchPosition', e); }

var meMarker = null, markers = [], routeReady = false, lastData = null;

/* ---------- Манёвры и навигационная карточка ----------------------------- */
var navSteps = [], navIndex = 0, navStepsKey = '', navRouteSummary = null;
var nextTurnDistance = null, navWasFollowing = false;

function haversineM(lat1, lng1, lat2, lng2){
  var r = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2)
    + Math.cos(lat1*rad) * Math.cos(lat2*rad)
    * Math.sin(dLng/2) * Math.sin(dLng/2);
  return 2 * r * Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0, 1-a)));
}

function maneuverIcon(step){
  if (!step) return '↑';
  var type = String(step.type || '').toLowerCase();
  var mod = String(step.modifier || '').toLowerCase();
  if (type === 'arrive') return '◆';
  if (type.indexOf('roundabout') >= 0 || type === 'rotary') return '↻';
  if (mod === 'uturn') return '⤵';
  if (mod === 'sharp left') return '⬅';
  if (mod === 'sharp right') return '➡';
  if (mod === 'left') return '↰';
  if (mod === 'right') return '↱';
  if (mod === 'slight left') return '↖';
  if (mod === 'slight right') return '↗';
  return '↑';
}

function maneuverText(step){
  if (!step) return 'Следуйте по маршруту';
  var type = String(step.type || '').toLowerCase();
  var mod = String(step.modifier || '').toLowerCase();
  if (type === 'arrive') return 'Пункт назначения';
  if (type.indexOf('roundabout') >= 0 || type === 'rotary')
    return step.exit ? ('Круг · ' + step.exit + '-й съезд') : 'Круговое движение';
  if (mod === 'uturn') return 'Развернитесь';
  if (mod === 'left') return 'Поверните налево';
  if (mod === 'right') return 'Поверните направо';
  if (mod === 'slight left') return 'Держитесь левее';
  if (mod === 'slight right') return 'Держитесь правее';
  if (mod === 'sharp left') return 'Резко налево';
  if (mod === 'sharp right') return 'Резко направо';
  if (type === 'merge') return 'Вливайтесь в поток';
  if (type === 'off ramp') return 'Съезд';
  return 'Двигайтесь прямо';
}

function formatNavDistance(meters){
  if (meters < 45) return 'Сейчас';
  if (meters < 950){
    var step = meters < 200 ? 10 : (meters < 500 ? 50 : 100);
    return 'Через ' + Math.max(step, Math.round(meters / step) * step) + ' м';
  }
  return 'Через ' + (meters / 1000).toFixed(meters < 2000 ? 1 : 0) + ' км';
}

function setNavigationSteps(data){
  var steps = Array.isArray(data.steps) ? data.steps : [];
  var key = steps.map(function(s){
    return (s.loc || []).join(',') + ':' + (s.type || '') + ':' + (s.modifier || '');
  }).join('|');
  if (key !== navStepsKey){
    navStepsKey = key;
    navSteps = steps;
    navIndex = 0;
  }
  navRouteSummary = data.routeSummary || null;
}

function updateNavigation(lat, lng, follow){
  var panel = document.getElementById('navPanel');
  if (!follow || !navSteps.length){
    panel.style.display = 'none';
    document.body.classList.remove('nav-mode');
    nextTurnDistance = null;
    if (!follow && navWasFollowing){
      // Свернули навигатор: плоская карта, север снова сверху
      try{ map.easeTo({ bearing: 0, pitch: 0, offset: [0,0], duration: 350 }); }catch(e){}
    }
    navWasFollowing = false;
    return;
  }
  navWasFollowing = true;

  // Пропускаем уже пройденные точки. Первый шаг часто depart прямо под машиной.
  while (navIndex < navSteps.length){
    var s = navSteps[navIndex], loc = s.loc || [];
    if (loc.length < 2){ navIndex++; continue; }
    var d = haversineM(lat, lng, Number(loc[0]), Number(loc[1]));
    if (d <= 32 && navIndex < navSteps.length - 1){ navIndex++; continue; }
    nextTurnDistance = d;
    break;
  }

  var step = navSteps[Math.min(navIndex, navSteps.length - 1)];
  if (!step){ panel.style.display = 'none'; return; }
  var action = maneuverText(step);
  var street = String(step.name || '').trim();
  document.getElementById('navIcon').textContent = maneuverIcon(step);
  document.getElementById('navDistance').textContent = formatNavDistance(nextTurnDistance || 0);
  document.getElementById('navStreet').textContent = street ? (action + ' · ' + street) : action;

  var bits = [];
  if (navRouteSummary){
    var km = Number(navRouteSummary.distanceKm || 0);
    var min = Number(navRouteSummary.durationMinutes || 0);
    if (km > 0) bits.push(km.toFixed(1) + ' км');
    if (min > 0) bits.push('≈ ' + Math.round(min) + ' мин');
  }
  document.getElementById('navSummary').textContent = bits.join(' · ');
  panel.style.display = 'block';
  document.body.classList.add('nav-mode');
}

/* ---------- Слои TomTom (пробки, происшествия) поверх OSM, но ПОД линией
   маршрута. Приложение управляет ими через setOverlay(id, url, show). */
function overlayIds(id){ return { src: 'tt-' + id + '-src', layer: 'tt-' + id }; }

window.setOverlay = function(id, tileUrl, show){
  try{
    var ids = overlayIds(id);
    var has = !!map.getLayer(ids.layer);
    if (!show || !tileUrl){
      if (has) map.removeLayer(ids.layer);
      if (map.getSource(ids.src)) map.removeSource(ids.src);
      if (id === 'flow') document.getElementById('trafficLegend').style.display = 'none';
      return 'off';
    }
    if (!map.isStyleLoaded()){
      map.once('idle', function(){ window.setOverlay(id, tileUrl, show); });
      return 'wait';
    }
    if (!has){
      if (!map.getSource(ids.src))
        map.addSource(ids.src, { type: 'raster', tiles: [tileUrl], tileSize: 256,
          maxzoom: 19, attribution: '© TomTom' });
      // Происшествия рисуем выше пробок, но оба слоя — ПОД окантовкой маршрута
      var before = map.getLayer('route-casing') ? 'route-casing'
        : (map.getLayer('route-line') ? 'route-line' : undefined);
      map.addLayer({ id: ids.layer, type: 'raster', source: ids.src,
        paint: { 'raster-opacity': id === 'incidents' ? 1 : 0.88,
                 'raster-fade-duration': 0 } }, before);
    } else {
      var src = map.getSource(ids.src);
      if (src && src.setTiles) src.setTiles([tileUrl]);
    }
    if (id === 'flow') document.getElementById('trafficLegend').style.display = 'block';
    return 'on';
  }catch(e){ return 'err:' + e.message; }
};

/* Совместимость с прежним вызовом приложения */
window.setTraffic = function(tileUrl, show){ return window.setOverlay('flow', tileUrl, show); };

/* Базовая карта: тайлы TomTom вместо OSM (офлайн-кеш работает только с OSM) */
window.setBaseMap = function(tileUrl){
  try{
    var src = map.getSource('osm');
    if (src && src.setTiles) src.setTiles([tileUrl || TILE]);
    // Подложка TomTom включена — растровый слой не гасим даже там,
    // где есть офлайн-пакет: водитель выбрал её сознательно
    window._ttBase = !!tileUrl;
    syncRasterVisibility();
    return 'ok';
  }catch(e){ return 'err:' + e.message; }
};

/* ---------- Офлайн-пакет векторных тайлов (OpenStreetMap → PMTiles) -------
   Пакет Тюмени и Тюменского района лежит внутри приложения и отдаётся
   локальным сервером: карта работает без интернета, без ключей и лимитов.
   Пока пакет копируется из APK, показываются растровые тайлы; как только
   он готов — добавляются векторные слои, а внутри покрытия растр гасится
   (иначе подписи задваиваются). За пределами района — снова растр. */
var vectorBounds = null, vectorAdded = false, vectorTries = 0;

function insideVectorPack(){
  if (!vectorBounds) return false;
  var c = map.getCenter();
  return c.lng >= vectorBounds[0] && c.lng <= vectorBounds[2]
      && c.lat >= vectorBounds[1] && c.lat <= vectorBounds[3];
}

function syncRasterVisibility(){
  try{
    if (!vectorAdded || !map.getLayer('osm')) return;
    // Растр гасим только на детальных зумах внутри пакета: ниже z10
    // векторные слои скромнее (облегчённый Natural Earth), их несёт растр
    var vis = (insideVectorPack() && map.getZoom() >= 10 && !window._ttBase)
      ? 'none' : 'visible';
    if (map.getLayoutProperty('osm', 'visibility') !== vis)
      map.setLayoutProperty('osm', 'visibility', vis);
  }catch(e){}
}

function addVectorLayers(info){
  if (vectorAdded) return;
  fetch('style-vector.json', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(style){
      var layers = (style && style.sourceLayers) || [];
      if (!layers.length) return;

      if (!map.getSource('omt')){
        map.addSource('omt', {
          type: 'vector',
          tiles: [location.origin + '/vector/{z}/{x}/{y}.pbf'],
          minzoom: 0,
          maxzoom: info.maxzoom || 14,
          bounds: info.bounds,
          attribution: '© OpenStreetMap'
        });
      }
      // Базовая векторная карта должна быть ПОД пробками/ДТП и маршрутом
      var before = map.getLayer('tt-flow') ? 'tt-flow'
        : (map.getLayer('tt-incidents') ? 'tt-incidents'
          : (map.getLayer('route-casing') ? 'route-casing'
            : (map.getLayer('route-line') ? 'route-line' : undefined)));
      layers.forEach(function(l){
        if (map.getLayer(l.id)) return;
        try{ map.addLayer(l, before); }catch(e){ console.warn('vector layer ' + l.id, e); }
      });

      vectorAdded = true;
      vectorBounds = info.bounds || null;
      syncRasterVisibility();
    })
    .catch(function(e){ console.warn('style-vector', e); });
}

function initVectorPack(){
  fetch('/mapinfo.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(info){
      if (info && info.vector){
        if (map.isStyleLoaded()) addVectorLayers(info);
        else map.once('idle', function(){ addVectorLayers(info); });
        return;
      }
      // Пакет ещё копируется из APK (десятки МБ) — ждём
      if (++vectorTries < 40) setTimeout(initVectorPack, 3000);
    })
    .catch(function(){ if (++vectorTries < 40) setTimeout(initVectorPack, 3000); });
}

map.on('moveend', syncRasterVisibility);

function el(cls){ var d = document.createElement('div'); d.className = 'mk ' + cls; return d; }

function clearMarkers(){ markers.forEach(function(m){ m.remove(); }); markers = []; }

/* Приложение вызывает это при каждом изменении маршрута — БЕЗ перезагрузки */
window.setRoute = function(json){
  try{
    var d = typeof json === 'string' ? JSON.parse(json) : json;
    lastData = d;
    setNavigationSteps(d);

    if (d.tilesVersion && d.tilesVersion !== window._tilesVersion){
      window._tilesVersion = d.tilesVersion;
      try {
        var osm = map.getSource('osm');
        if (osm && osm.setTiles)
          osm.setTiles([TILE + '?v=' + d.tilesVersion]);
      } catch(e){}
    }
    if (!map.isStyleLoaded()) { map.once('idle', function(){ window.setRoute(d); }); return 'wait'; }

    clearMarkers();
    var pts = [];
    var fitPts = [];   // смысловые точки — ключ автофита (линия не участвует)

    if (d.stops) d.stops.forEach(function(s, i){
      markers.push(new maplibregl.Marker({ element: el('s') })
        .setLngLat([s.lng, s.lat])
        .setPopup(new maplibregl.Popup().setText((i + 1) + '. ' + (s.label || '')))
        .addTo(map));
      pts.push([s.lng, s.lat]);
      fitPts.push([s.lng, s.lat]);
    });
    if (d.target){
      markers.push(new maplibregl.Marker({ element: el('a') })
        .setLngLat([d.target.lng, d.target.lat])
        .setPopup(new maplibregl.Popup().setText(d.target.label || 'Точка')).addTo(map));
      pts.push([d.target.lng, d.target.lat]);
      fitPts.push([d.target.lng, d.target.lat]);
    }
    if (d.finish){
      markers.push(new maplibregl.Marker({ element: el('b') })
        .setLngLat([d.finish.lng, d.finish.lat])
        .setPopup(new maplibregl.Popup().setText('Финиш')).addTo(map));
      pts.push([d.finish.lng, d.finish.lat]);
      fitPts.push([d.finish.lng, d.finish.lat]);
    }

    /* Линия маршрута по дорогам (геометрия пришла вместе с заказом → офлайн) */
    /* Только реальная дорожная геометрия. Прямую линию «по воздуху»
       (через озёра и дворы) не рисуем — она вводила водителя в заблуждение. */
    var line = (d.geometry || []).map(function(p){ return [p[1], p[0]]; });
    if (line.length < 3) line = [];
    var gj = { type: 'Feature', geometry: { type: 'LineString', coordinates: line } };
    if (map.getSource('route')) map.getSource('route').setData(gj);
    else map.addSource('route', { type: 'geojson', data: gj });

    // Тёмная окантовка отделяет маршрут от жёлтых/красных линий пробок
    if (!map.getLayer('route-casing')){
      map.addLayer({ id: 'route-casing', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#343439',
          'line-width': ['interpolate', ['linear'], ['zoom'], 12, 7, 16, 11, 19, 16],
          'line-opacity': .82
        }
      });
    }
    if (!map.getLayer('route-line')){
      map.addLayer({ id: 'route-line', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#FACC15',
          'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 16, 7, 19, 11],
          'line-opacity': 1
        }
      });
    }
    line.forEach(function(c){ pts.push(c); });

    if (d.driver && d.driver.lat && d.driver.lng){
      window.updateDriver(
        d.driver.lat, d.driver.lng, !!d.follow,
        d.driver.bearing, d.driver.speed
      );
      if (!window._centered){
        window._centered = true;
        map.jumpTo({ center: [d.driver.lng, d.driver.lat], zoom: 14 });
      }
    }

    // Автофит ТОЛЬКО при смене смысловых точек (подача/назначение/остановки):
    // обновление дорожной линии под едущую машину и GPS-тики больше не
    // сбрасывают масштаб и центр — конечную точку можно спокойно приблизить.
    var routeKey = JSON.stringify(fitPts);
    if (routeKey !== window._fitKey){
      window._fitKey = routeKey;
      releaseCamera(); // новый этап/заказ — обзор даже из ручного режима
      if (pts.length){
        var b = pts.reduce(function(acc, c){ return acc.extend(c); },
          new maplibregl.LngLatBounds(pts[0], pts[0]));
        map.fitBounds(b, { padding: 60, maxZoom: 16, duration: 0 });
      }
    }
    routeReady = true;
    return 'ok';
  }catch(e){ return 'err:' + e.message; }
};

/* Значок автомобиля вместо простой точки. */
function carElement(){
  var wrap = document.createElement('div');
  wrap.id = 'car';
  wrap.innerHTML =
    '<svg viewBox="0 0 44 44" width="44" height="44">' +
    '<g class="body" transform="rotate(0 22 22)">' +
    '<circle cx="22" cy="22" r="13" fill="rgba(250,204,21,.20)"/>' +
    '<path d="M22 5 L31 33 L22 27 L13 33 Z" fill="#FACC15" stroke="#1b1b1b" ' +
    'stroke-width="2" stroke-linejoin="round"/>' +
    '</g></svg>';
  return wrap;
}

function setCarBearing(deg){
  try{
    var body = document.querySelector('#car .body');
    if (body) body.setAttribute('transform', 'rotate(' + (deg || 0) + ' 22 22)');
  }catch(e){}
}

window.updateDriver = function(lat, lng, follow, bearing, speed){
  try{
    if (!lat || !lng) return 'no-coords';
    var ll = [Number(lng), Number(lat)];
    if (!meMarker) meMarker = new maplibregl.Marker({ element: carElement() }).setLngLat(ll).addTo(map);
    else meMarker.setLngLat(ll);

    // Курс: с GPS, иначе вычисляем по направлению последнего перемещения
    var deg = (bearing !== undefined && bearing !== null) ? Number(bearing) : null;
    if (deg === null && window._prevLL){
      var dx = ll[0] - window._prevLL[0], dy = ll[1] - window._prevLL[1];
      if (Math.abs(dx) > 1e-6 || Math.abs(dy) > 1e-6)
        deg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
    }
    // Маркер вращается относительно экрана. Когда сама карта уже повернута
    // по курсу, вычитаем её bearing — иначе направление применялось дважды.
    if (deg !== null) setCarBearing(deg - map.getBearing());
    window._prevLL = ll;

    updateNavigation(Number(lat), Number(lng), !!follow);

    if (routeReady && lastData && lastData.geometry && lastData.geometry.length > 1){
      /* стартовая точка линии следует за водителем */
      var src = map.getSource('route');
      if (src && src._data && src._data.geometry.coordinates.length){
        src._data.geometry.coordinates[0] = ll;
        src.setData(src._data);
      }
    }

    /* ── НАВИГАТОРСКИЙ РЕЖИМ (как в Яндекс.Навигаторе) ──────────────────────
       В полноэкранном режиме (follow) камера не просто следует за машиной,
       а разворачивает карту по курсу и приближает её настолько, чтобы были
       хорошо видны повороты и строения. Масштаб зависит от скорости:
       стоя/медленно — крупнее (виден каждый поворот),
       быстро — чуть мельче (видно перекрёсток заранее). */
    if (follow && !cameraHeld()){
      var sp = (speed !== undefined && speed !== null) ? Number(speed) : null;

      // Масштаб по скорости (м/с → км/ч)
      var kmh = (sp !== null && !isNaN(sp)) ? sp * 3.6 : 20;
      var targetZoom;
      if (kmh < 15)       targetZoom = 17.2;
      else if (kmh < 40)  targetZoom = 16.6;
      else if (kmh < 70)  targetZoom = 16.0;
      else                targetZoom = 15.4;

      // Перед ближайшим поворотом приближаемся сильнее независимо от скорости
      if (nextTurnDistance !== null){
        if (nextTurnDistance < 80)       targetZoom = Math.max(targetZoom, 18.0);
        else if (nextTurnDistance < 180) targetZoom = Math.max(targetZoom, 17.6);
        else if (nextTurnDistance < 350) targetZoom = Math.max(targetZoom, 17.2);
        else if (nextTurnDistance < 700) targetZoom = Math.max(targetZoom, 16.7);
      }

      // Стоя на месте курс GPS прыгает — не вращаем карту без движения
      var targetBearing = (deg !== null && kmh >= 6) ? deg : map.getBearing();
      var mapHeight = map.getContainer().clientHeight || 500;

      // В режиме «курс вверх» машина смотрит строго вверх экрана
      if (deg !== null && kmh >= 6) setCarBearing(0);

      map.easeTo({
        center: ll,
        zoom: targetZoom,
        bearing: targetBearing,
        // Машина ниже центра: впереди видно примерно 70% экрана
        offset: [0, Math.round(mapHeight * 0.20)],
        // Небольшой наклон даёт ощущение навигатора, но не искажает повороты
        pitch: kmh >= 8 ? 35 : 20,
        duration: 650,
        easing: function(t){ return t * t * (3 - 2 * t); }
      });
    }
    return 'ok';
  }catch(e){ return 'err:' + e.message; }
};

window.mapCenter = function(lat, lng){
  try{ releaseCamera(); map.easeTo({ center: [Number(lng), Number(lat)], zoom: 15, duration: 300 }); }catch(e){}
};
window.mapResize = function(){ try{ map.resize(); }catch(e){} };

/* ---------- Офлайн-индикатор ---------- */
function setOffline(v){ document.getElementById('badge').style.display = v ? 'block' : 'none'; }
window.addEventListener('offline', function(){ setOffline(true); });
window.addEventListener('online',  function(){ setOffline(false); });
if (navigator.onLine === false) setOffline(true);

/* Скачивание города выполняется нативным C# с прогрессом под картой. */

map.on('error', function(e){
  var msg = (e && e.error && e.error.message) ? String(e.error.message) : '';
  if (/tile|Failed to fetch|network/i.test(msg)){
    // Единичные промахи тайлов в офлайне — норма. Массовые — показываем причину.
    if (++tileErrors === 12 && navigator.onLine !== false){
      var f = document.getElementById('fatal');
      f.style.display = 'block';
      f.innerHTML = 'Тайлы карты не загружаются.<br>Проверьте интернет и нажмите «Скачать карту города».';
      setTimeout(function(){ f.style.display = 'none'; }, 6000);
    }
    return;
  }
});
map.on('load', function(){
  document.getElementById('fatal').style.display = 'none';
  if (lastData) window.setRoute(lastData);
  startStatePolling();
  initVectorPack();
});

/* Данные берём сами с локального сервера приложения: это работает всегда,
   в отличие от вызовов JS снаружи, которые на части устройств не проходили. */
var lastStateHash = '';
function startStatePolling(){
  async function tick(){
    try{
      var r = await fetch('/state.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok){
        var txt = await r.text();
        if (txt && txt !== lastStateHash && txt !== '{}'){
          lastStateHash = txt;
          var st = JSON.parse(txt);
          window.setRoute(st);
        }
      }
    }catch(e){}
    setTimeout(tick, 1500);
  }
  tick();
}

/* Явная проверка: если движок не загрузился — показываем причину, а не тёмный экран */
if (typeof maplibregl === 'undefined'){
  document.getElementById('fatal').style.display = 'block';
  document.getElementById('fatal').innerHTML =
    'Файлы карты не найдены в пакете приложения.<br>Обновите приложение до новой версии.';
}
window.mapReady = true;
</script></body></html>
